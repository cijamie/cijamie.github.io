<footer class="site-footer">
  <div class="container container-wide footer-inner">
    <div class="footer-about">
      <a href="{{ '/' | relative_url }}" class="footer-wordmark">{{ site.title }}</a>
      <p class="footer-desc">{{ site.description }}</p>
    </div>

    <nav class="footer-nav" aria-label="Footer">
      <ul>
        <li><a href="{{ '/' | relative_url }}">Papers</a></li>
        <li><a href="{{ '/archive/' | relative_url }}">Archive</a></li>
        <li><a href="{{ '/projects/' | relative_url }}">Projects</a></li>
        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      </ul>
      <ul>
        <li><a href="{{ '/feed.xml' | relative_url }}">RSS feed</a></li>
        <li><a href="https://github.com/cijamie" rel="noopener">GitHub</a></li>
      </ul>
    </nav>

    <p class="footer-copy">&copy; {{ "now" | date: "%Y" }} {{ site.author_name | default: site.author }}. Published with Jekyll on GitHub Pages.</p>
  </div>
</footer>
