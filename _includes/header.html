<header class="site-header">
  <div class="container container-wide header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">
      <span class="wordmark-name">{{ site.title }}</span>
      <span class="wordmark-tag">Research and writing by {{ site.author_name | default: site.author }}</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <ul class="nav-menu">
        <li><a href="{{ '/' | relative_url }}" class="nav-link"{% if page.url == '/' or page.layout == 'post' %} aria-current="page"{% endif %}>Papers</a></li>
        <li><a href="{{ '/archive/' | relative_url }}" class="nav-link"{% if page.url contains '/archive' %} aria-current="page"{% endif %}>Archive</a></li>
        <li><a href="{{ '/projects/' | relative_url }}" class="nav-link"{% if page.url contains '/projects' %} aria-current="page"{% endif %}>Projects</a></li>
        <li><a href="{{ '/about/' | relative_url }}" class="nav-link"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/feed.xml' | relative_url }}" class="nav-link nav-link-feed" title="Subscribe with an RSS reader">RSS</a></li>
      </ul>
    </nav>
  </div>
</header>
