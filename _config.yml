# Site Settings
title: "jme.log"
author: "Jamie"
author_name: "Jamie Sessions"     # Full name shown in the header and used for citations
author_citation: "Sessions, J."   # APA-style author used in the "Cite this paper" box
affiliation: "University of Idaho"
description: "A log of geopolitical issues, study abroad experiences, and other reflections."
url: "https://ijme.tk" # Matches CNAME so canonical links and citations use your domain
baseurl: "" # Root domain on GitHub Pages for <username>.github.io
logo: "/assets/images/logo.png"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - new_post.ps1
  - .github

# Plugins (supported by GitHub Pages natively)
plugins:
  - jekyll-seo-tag
  - jekyll-feed

# Giscus Comments Settings
# Note: You need to enable GitHub Discussions in your repo, install the giscus app,
# and replace the repo_id and category_id below with your actual values from https://giscus.app
giscus:
  repo: "cijamie/jme.log"
  repo_id: "R_kgDOT82Cag"
  category: "General"
  category_id: "DIC_kwDOT82Cas4DDrax"
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "bottom"
  lang: "en"
  loading: "lazy"
