<!DOCTYPE html>
<html lang="en">
<head>
  <!-- CookieYes cookie banner -->
  <script id="cookieyes" type="text/javascript" src="https://cdn-cookieyes.com/client_data/87074c861294ca9690a7c131/script.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-68XPQ1X6ZF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-68XPQ1X6ZF');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <meta name="theme-color" content="#fbf9f4">
  <link rel="icon" type="image/png" href="{{ '/assets/images/logo.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/logo.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=5.0">
  <link rel="stylesheet" href="{{ '/assets/css/monograph.css' | relative_url }}?v=5.0">
  {% feed_meta %}
  <script src="{{ '/assets/js/main.js' | relative_url }}?v=5.0" defer></script>
  <script src="{{ '/assets/js/monograph.js' | relative_url }}?v=5.0" defer></script>
</head>
<body class="{% if page.layout == 'post' %}is-post{% else %}is-page{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="reading-progress" class="reading-progress-bar" aria-hidden="true"></div>
  <div class="site-wrapper">
    {% include header.html %}

    <main id="main" class="site-main">
      {{ content }}
    </main>

    {% include footer.html %}
  </div>
</body>
</html>
